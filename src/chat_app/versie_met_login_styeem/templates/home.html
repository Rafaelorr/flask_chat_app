<head>
  <link rel="stylesheet" href="/static/css/home.css">
</head>
{% extends 'base.html' %} {% block content %}
<form method="post" class="buttons">
  <h3>Enter The Chat Room</h3>
  <div>
    <label>Name:</label>
    <input type="text" placeholder="Pick a name!" name="naam" value="{{name}}"/>
  </div>
  <div class="join">
    <input type="text" placeholder="Room Code" name="code" value="{{code}}" />
    <button type="submit" name="join">Join a Room</button>
  </div>
  <input type="text" name="room_id" placeholder="Custom room id" value="{{room_id}}">
  <button type="submit" name="create" class="create-btn">Create a Room</button>
  {% if error %}
  <ul>
    <li>{{error}}</li>
  </ul>
  {% endif %}
  <a href="http://192.168.76.202:5000/doc">doc</a>
</form>
{% endblock %}
